name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      # Payload allowlist, committed-files-only and dev-path scan. The name/email
      # part of the PII scan is only meaningful locally (here it sees the runner).
      - run: node scripts/package.mjs

      # AMO's own validator, on exactly what ships. Fails on errors, not warnings.
      - name: web-ext lint
        run: |
          mkdir "$RUNNER_TEMP/xpi"
          unzip -q web-ext-artifacts/*.zip -d "$RUNNER_TEMP/xpi"
          npx --yes web-ext@10.8.0 lint --source-dir "$RUNNER_TEMP/xpi"
