<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instagram accounts</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<ul id="accounts"></ul>
<button id="new" type="button">New tab for another account</button>
<p id="hint" class="hint">Opens a container tab signed in as this tab's account. Switch accounts there with Instagram's own switcher: only that container changes, and other tabs keep theirs.</p>
<p id="off" class="hint" hidden>Container tabs are turned off. Turn on Settings › General › Tabs › Enable Container Tabs to keep accounts in separate tabs.</p>
<script src="popup.js"></script>
</body>
</html>
